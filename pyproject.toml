[project]
name = "zero-api"
version = "0.1.0"
description = "Unofficial Python client for Finanzen.net ZERO"
readme = "README.md"
authors = [
    { name = "Klaus Deja", email = "klaus.deja@easesolutions.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
exclude = ["captures/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
