[project]
name = "zero-api"
version = "0.1.0"
description = "Unofficial Python client for Finanzen.net ZERO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Klaus Deja", email = "klaus.deja@easesolutions.com" }
]
keywords = ["finanzen.net", "zero", "broker", "trading", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.urls]
Homepage = "https://github.com/wtfuii/zero-api"
Repository = "https://github.com/wtfuii/zero-api"
Issues = "https://github.com/wtfuii/zero-api/issues"
Releases = "https://github.com/wtfuii/zero-api/releases"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
exclude = ["captures/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
